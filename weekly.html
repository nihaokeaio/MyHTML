}

function clearEntries(){
 for(const id of ['entries','dates','mobile-date']) byId(id).replaceChildren();
}

 button.onclick=()=>jumpToWeek(article.id);
 byId('dates').append(button);
 mobileDates.add(new Option(date,article.id));
 return article;
}
