<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobRadar · 招聘雷达</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#20372f;font:15px/1.65 system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:980px;margin:auto;padding:25px 18px 80px}a{color:#247a53}header{background:#173b36;color:white;padding:34px 18px}header>div{max-width:980px;margin:auto}header a{color:#d3e8da}h1{font-size:36px;margin:12px 0 4px}.muted{color:#708477}.panel,.job{background:white;border-radius:16px;padding:18px;margin:15px 0;box-shadow:0 4px 20px #20372f0c}.controls{display:flex;gap:12px;flex-wrap:wrap}input,select{font:inherit;border:1px solid #d5dfd8;border-radius:10px;padding:10px;min-width:180px;flex:1}.score{font-size:22px;font-weight:700;color:#26744e}.top{display:flex;justify-content:space-between;gap:12px}.job h3{margin:0 0 5px}.pill{background:#e6f0e9;border-radius:30px;padding:3px 9px;font-size:12px;display:inline-block;margin:5px 4px 0 0}.warn{color:#97621e}#list:empty:after{content:"暂无已验证岗位。可稍后刷新或检查采集状态。";display:block;padding:35px;text-align:center;color:#708477}@media(max-width:600px){h1{font-size:29px}.controls{display:block}.controls>*{display:block;width:100%;margin:8px 0}}</style></head><body><header><div><a href="../index.html">← 返回我的生活地图</a><h1>📡 JobRadar</h1><p>杭州优先 · 国企社招 / 科研院所 / 事业单位 · C++ 与三维研发</p></div></header><main><section class="panel"><b>岗位雷达 · V0.1</b><p class="muted" id="meta">正在读取数据…</p><div class="controls"><input id="q" placeholder="搜索岗位 / 单位 / 来源"><select id="sort"><option value="recent">最新发现</option><option value="score">匹配评分</option></select><select id="filter"><option value="all">全部候选</option><option value="tech">标题包含技术关键词</option></select></div><p class="muted">注意：匹配分仅根据公告标题初筛，学历、专业、编制、报名期限均须核对官方原文。采集到的公告不等于可投递岗位。</p></section><section id="list"></section></main><script>
let jobs=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){let q=document.querySelector("#q").value.toLowerCase(),sort=document.querySelector("#sort").value,filter=document.querySelector("#filter").value;let a=jobs.filter(j=>(j.title+" "+j.source).toLowerCase().includes(q)&& (filter!=="tech"||j.score>=40));a.sort((x,y)=>sort==="score"?y.score-x.score:String(y.first_seen).localeCompare(String(x.first_seen)));document.querySelector("#list").innerHTML=a.map(j=>`<article class="job"><div class="top"><div><h3>${esc(j.title)}</h3><span class="muted">${esc(j.source)}</span></div><span class="score">${Number(j.score)||0}</span></div><span class="pill">资格：${esc(j.eligibility)}</span><span class="pill">用工：${esc(j.employment)}</span><p class="muted">首次发现：${esc(j.first_seen?.slice(0,10)||"未知")} · 截止日期：${esc(j.deadline||"未提取")}</p><a href="${esc(j.url)}" target="_blank" rel="noopener noreferrer">查看官方来源 →</a></article>`).join("");}
["q","sort","filter"].forEach(id=>document.getElementById(id).addEventListener("input",render));
fetch("./jobs.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(data=>{jobs=data.jobs||[];let err=(data.sources_failed||[]).length;document.querySelector("#meta").textContent=`收录 ${jobs.length} 条候选公告 · 上次更新：${data.updated_at||"尚未运行"} · 来源成功：${data.sources_ok||0} · 失败：${err}`+(err?" ⚠️ 请检查 Actions 日志":"");render()}).catch(e=>document.querySelector("#meta").textContent="数据读取失败："+e.message);
</script></body></html>
