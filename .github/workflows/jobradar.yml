name: JobRadar validation (no data writes)
on:
  workflow_dispatch:
  push:
    branches:
      - codex/jobradar-v0.1
    paths:
      - 'scripts/**'
      - 'jobradar/**'
      - '.github/workflows/jobradar.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collection dependencies
        run: python -m pip install -r scripts/requirements-jobradar.txt
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Static page checks
        run: node scripts/test_jobradar_page.cjs
